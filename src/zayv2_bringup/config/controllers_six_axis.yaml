# 六轴硬件和轨迹控制器分阶段激活；启动时不会发运动目标。
controller_manager:
    ros__parameters:
        update_rate: 100
        hardware_components_initial_state:
            inactive:
                - DamiaoArm
        joint_state_broadcaster:
            type: joint_state_broadcaster/JointStateBroadcaster
        arm_controller:
            type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
    ros__parameters:
        joints:
            - joint1
            - joint2
            - joint3
            - joint4
            - joint5
            - joint6
        command_interfaces:
            - position
        state_interfaces:
            - position
            - velocity
        open_loop_control: false
        # 终点必须由实测反馈确认；超时或误差过大时返回 Action 失败。
        constraints:
            goal_time: 1.0
            stopped_velocity_tolerance: 0.05
            joint1:
                goal: 0.05
            joint2:
                goal: 0.05
            joint3:
                goal: 0.05
            joint4:
                goal: 0.05
            joint5:
                goal: 0.05
            joint6:
                goal: 0.05
        state_publish_rate: 50.0
        action_monitor_rate: 20.0
