# 六轴真机配置；零偏取自注册时电机输出角，假定当时机械臂处于零位姿态。
# 方向与限位须与 URDF 及台架标定一致；默认禁止使能。
bus:
    can_interface: can0
    feedback_timeout_ms: 1000
    management_timeout_ms: 100
    management_quiet_period_ms: 5
    inactive_poll_period_ms: 100
    max_control_period_ms: 50
    allow_enable_on_activate: true
joints:
    - joint_name: joint1
      motor_name: motor_1
      model: J4340-2EC
      esc_id: 1
      mst_id: 17
      direction: 1
      zero_offset_motor_output_rad: 0.000191
      extra_reduction: 1.0
      min_position_rad: -3.1415
      max_position_rad: 3.1415
      max_velocity_rad_s: 3.0
      activation_position_tolerance_rad: 0.05
